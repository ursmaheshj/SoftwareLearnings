name: Terraform_workflow_for_AWS_infra
on:
  workflow_dispatch:
    inputs:
      infra_folder:
        type: choice
        description: 'Select the infrastructure folder to work with'
        options:
          - webapparch1
          - webapparch2
      operation:
        type: choice
        description: 'Select the Terraform operation to perform'
        options:
          - plan
          - apply
          - destroy
jobs:
  terraform:
    name: 'Terraform AWS Infrastructure Creation'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.6'

      - name: Navigate to selected infrastructure folder
        run: |
          cd Terraform/${{ github.event.inputs.infra_folder }}

          terraform init

          if [[ "${{ github.event.inputs.operation }}" == "apply" ]]; then 
            terraform apply -auto-approve
          elif [[ "${{ github.event.inputs.operation }}" == "destroy" ]]; then
            terraform destroy -auto-approve
          else 
            terraform plan
          fi