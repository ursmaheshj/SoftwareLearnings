<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask app</title>
</head>
<body>
    <h5>Homepage</h5>
    <p>Home page of website</p>
    <hr>
    {% for i in range(10) %}
    {% if  i%2==0 %}
    <p>{{i}}</p>
    {% else %}
    <p>{{i+2}}</p>
    {% endif %}
    {% endfor %}
</body>
</html>
